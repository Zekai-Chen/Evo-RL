teleop:
  type: bi_so_leader
  id: bi_leader
  left_arm_config:
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14110746-if00
  right_arm_config:
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14032215-if00

robot:
  type: bi_so_follower
  id: bi_follower
  left_arm_config:
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14032350-if00
    cameras:
      left_wrist:
        type: opencv
        index_or_path: /dev/v4l/by-path/pci-0000:06:00.0-usb-0:4:1.0-video-index0
        width: 640
        height: 480
        fps: 30
        fourcc: MJPG
      top:
        type: intelrealsense
        serial_number_or_name: "827112073332"
        width: 640
        height: 480
        fps: 30
        warmup_s: 2
  right_arm_config:
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6079934-if00
    cameras:
      right_wrist:
        type: opencv
        index_or_path: /dev/v4l/by-path/pci-0000:06:00.0-usb-0:3:1.0-video-index0
        width: 640
        height: 480
        fps: 30
        fourcc: MJPG
      side:
        type: intelrealsense
        serial_number_or_name: "215322072684"
        width: 640
        height: 480
        fps: 30
        warmup_s: 2

display_data: true
